<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Calculator</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
    }

    body {
        /* Ganti background hitam pekat dengan wallpaper estetik abstrak ala iOS biar efek kacanya kelihatan menonjol */
        background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    /* Container Utama: LIQUID GLASS STYLE */
    .calculator {
        width: 100%;
        max-width: 375px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        
        /* Efek Kaca Frosted */
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        
        /* Efek Bayangan Cair (Liquid Ambient Shadow) */
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                    inset 0 1px 2px rgba(255, 255, 255, 0.1);
    }

    /* Layar Display */
    .display {
        color: #fff;
        font-size: 5.5rem;
        font-weight: 200; /* Bikin font lebih tipis ala iOS modern */
        text-align: right;
        padding: 10px 20px;
        margin-bottom: 20px;
        overflow-x: auto;
        white-space: nowrap;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .display::-webkit-scrollbar {
        display: none;
    }

    /* Grid Tombol */
    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
    }

    /* Dasar Tombol Kaca Cair */
    .btn {
        border: none;
        border-radius: 50%;
        aspect-ratio: 1;
        font-size: 2.2rem;
        font-weight: 400;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
        position: relative;
        overflow: hidden;
        
        /* Transisi halus saat tombol dilepas */
        transition: background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                    transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
                    box-shadow 0.4s ease;
    }

    /* EFEK PAS KETEKEN (Liquid Specular Highlight) */
    .btn:active {
        transition: none; /* Instan pas ditekan */
        transform: scale(0.92); /* Efek amblas ke dalam kaca */
    }

    /* 1. Tombol Angka (Gelap Transparan) */
    .btn-number {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }
    .btn-number:active {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* 2. Tombol Operator (Oranye Cair Gleser) */
    .btn-operator {
        background: linear-gradient(135deg, rgba(255, 159, 10, 0.7), rgba(255, 115, 0, 0.7));
        color: #fff;
        font-size: 2.5rem;
        border: 1px solid rgba(255, 159, 10, 0.2);
        backdrop-filter: blur(10px);
    }
    .btn-operator:active {
        background: linear-gradient(135deg, #ffb347, #ff7300);
        box-shadow: 0 0 25px rgba(255, 159, 10, 0.6);
    }

    /* 3. Tombol Fungsi Atas (Putih Susu Kaca) */
    .btn-function {
        background: rgba(255, 255, 255, 0.3);
        color: #fff;
        font-size: 1.8rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-function:active {
        background: rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    /* Tombol Nol Spesial */
    .btn-zero {
        grid-column: span 2;
        aspect-ratio: auto;
        border-radius: 50px;
        justify-content: flex-start;
        padding-left: 32px;
    }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display" id="display">0</div>

        <div class="buttons">
            <button class="btn btn-function" onclick="clearDisplay()">AC</button>
            <button class="btn btn-function" onclick="toggleSign()">+/-</button>
            <button class="btn btn-function" onclick="percentage()">%</button>
            <button class="btn btn-operator" onclick="inputOperator('/')">÷</button>

            <button class="btn btn-number" onclick="inputNumber('7')">7</button>
            <button class="btn btn-number" onclick="inputNumber('8')">8</button>
            <button class="btn btn-number" onclick="inputNumber('9')">9</button>
            <button class="btn btn-operator" onclick="inputOperator('*')">×</button>

            <button class="btn btn-number" onclick="inputNumber('4')">4</button>
            <button class="btn btn-number" onclick="inputNumber('5')">5</button>
            <button class="btn btn-number" onclick="inputNumber('6')">6</button>
            <button class="btn btn-operator" onclick="inputOperator('-')">−</button>

            <button class="btn btn-number" onclick="inputNumber('1')">1</button>
            <button class="btn btn-number" onclick="inputNumber('2')">2</button>
            <button class="btn btn-number" onclick="inputNumber('3')">3</button>
            <button class="btn btn-operator" onclick="inputOperator('+')">+</button>

            <button class="btn btn-number btn-zero" onclick="inputNumber('0')">0</button>
            <button class="btn btn-number" onclick="inputNumber('.')">,</button>
            <button class="btn btn-operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let displayValue = '0';
        let firstOperand = null;
        let waitingForSecondOperand = false;
        let operator = null;

        function updateDisplay() {
            // Mengganti titik menjadi koma saat ditampilkan biar makin mirip lokal/iOS
            display.textContent = displayValue.replace('.', ',');
            
            // Otomatis mengecilkan font kalau angkanya kepanjangan
            if (displayValue.length > 6) {
                display.style.fontSize = '3.5rem';
            } else {
                display.style.fontSize = '5.5rem';
            }
        }

        function inputNumber(number) {
            if (waitingForSecondOperand) {
                displayValue = number;
                waitingForSecondOperand = false;
            } else {
                if (number === '.') {
                    if (!displayValue.includes('.')) {
                        displayValue += '.';
                    }
                } else {
                    displayValue = displayValue === '0' ? number : displayValue + number;
                }
            }
            updateDisplay();
        }

        function inputOperator(nextOperator) {
            const inputValue = parseFloat(displayValue);

            if (operator && waitingForSecondOperand) {
                operator = nextOperator;
                return;
            }

            if (firstOperand === null && !isNaN(inputValue)) {
                firstOperand = inputValue;
            } else if (operator) {
                const result = performCalculation[operator](firstOperand, inputValue);
                displayValue = `${parseFloat(result.toFixed(7))}`;
                firstOperand = result;
            }

            waitingForSecondOperand = true;
            operator = nextOperator;
            updateDisplay();
        }

        const performCalculation = {
            '/': (firstOperand, secondOperand) => firstOperand / secondOperand,
            '*': (firstOperand, secondOperand) => firstOperand * secondOperand,
            '-': (firstOperand, secondOperand) => firstOperand - secondOperand,
            '+': (firstOperand, secondOperand) => firstOperand + secondOperand,
        };

        function calculate() {
            if (operator === null || waitingForSecondOperand) return;

            const inputValue = parseFloat(displayValue);
            const result = performCalculation[operator](firstOperand, inputValue);

            displayValue = `${parseFloat(result.toFixed(7))}`;
            firstOperand = null;
            operator = null;
            waitingForSecondOperand = false;
            updateDisplay();
        }

        function clearDisplay() {
            displayValue = '0';
            firstOperand = null;
            waitingForSecondOperand = false;
            operator = null;
            updateDisplay();
        }

        function toggleSign() {
            displayValue = (parseFloat(displayValue) * -1).toString();
            updateDisplay();
        }

        function percentage() {
            displayValue = (parseFloat(displayValue) / 100).toString();
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
